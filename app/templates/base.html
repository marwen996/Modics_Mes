<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MODICS{% endblock %}</title>
<!-- Thème et langue appliqués avant le premier rendu (évite le flash de thème) -->
<script>(function(){try{var t=localStorage.getItem("modics_theme");if(t)document.documentElement.dataset.theme=t;var l=localStorage.getItem("modics_lang");if(l)document.documentElement.lang=l;}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<div class="shell">
  <!-- Barre latérale : navigation, thème, langue (masquée en mode TV) -->
  <aside class="rail">
    <a class="rail-logo" href="{{ url_for('index') }}" aria-label="MODICS">M</a>
    <nav class="rail-nav">
      <a href="{{ url_for('index') }}" class="rail-link {% if active == 'atelier' %}active{% endif %}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
        <span data-i18n="nav_atelier"></span>
      </a>
      <a href="{{ url_for('fleet') }}" class="rail-link {% if active == 'fleet' %}active{% endif %}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><rect x="16" y="9.5" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.5" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/></svg>
        <span data-i18n="nav_fleet"></span>
      </a>
      <a href="{{ url_for('analysis') }}" class="rail-link {% if active == 'dashboard' %}active{% endif %}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span data-i18n="nav_dashboard"></span>
      </a>
      <a href="{{ url_for('pi_live.live_page') }}" class="rail-link {% if active == 'live' %}active{% endif %}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 12 7 12 10 5 14 19 17 12 21 12"/></svg>
        <span data-i18n="nav_live"></span>
      </a>
    </nav>
    <div class="rail-bottom">
      <button type="button" class="icon-btn" id="theme-btn">
        <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <div class="lang" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </aside>

  <div class="page">
    <header class="appbar">{% block header %}{% endblock %}</header>
    <main>{% block content %}{% endblock %}</main>
  </div>
</div>
<script src="{{ url_for('static', filename='shell.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
